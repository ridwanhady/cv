name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - cv.tex
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache TeX Live
        id: texlive-cache
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('.github/workflows/build-cv.yml') }}

      - name: Install minimal TeX Live
        if: steps.texlive-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/install-tl && cd /tmp/install-tl
          curl -fsSL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz \
            | tar -xz --strip-components=1
          cat > texlive.profile <<PROFILE
          selected_scheme scheme-basic
          TEXDIR $HOME/texlive
          TEXMFLOCAL $HOME/texlive/texmf-local
          TEXMFSYSVAR $HOME/texlive/texmf-var
          TEXMFSYSCONFIG $HOME/texlive/texmf-config
          instopt_adjustpath 0
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          PROFILE
          perl ./install-tl --no-interaction --profile=texlive.profile
          "$HOME/texlive/bin/x86_64-linux/tlmgr" install preprint enumitem geometry cm-super

      - name: Add TeX Live to PATH
        run: echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Compile cv.tex
        run: pdflatex -interaction=nonstopmode -halt-on-error cv.tex

      - name: Commit cv.pdf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          if git diff --cached --quiet; then
            echo "No changes to cv.pdf"
            exit 0
          fi
          git commit -m "chore: render cv.pdf [skip ci]"
          git push
