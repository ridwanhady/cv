name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - cv.tex
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up TeX Live (minimal, cached)
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: >-
            scheme-basic
            preprint
            enumitem
            geometry
            cm-super

      - name: Compile cv.tex
        run: pdflatex -interaction=nonstopmode -halt-on-error cv.tex

      - name: Commit cv.pdf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          if git diff --cached --quiet; then
            echo "No changes to cv.pdf"
            exit 0
          fi
          git commit -m "chore: render cv.pdf [skip ci]"
          git push
